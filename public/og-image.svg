<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="NotaMínima · Calculadora de notas universitarias">
  <rect width="1200" height="630" fill="#fffdf6"/>
  <!-- Cuaderno: margen rojo -->
  <rect x="80" y="60" width="1040" height="510" rx="18" fill="#fffdf6" stroke="#e8dcc8" stroke-width="2"/>
  <line x1="160" y1="60" x2="160" y2="570" stroke="#e86a6a" stroke-width="4" opacity="0.55"/>
  <!-- Líneas horizontales del cuaderno -->
  <g stroke="#cfe0f2" stroke-width="2.5" opacity="0.7">
    <line x1="180" y1="140" x2="1080" y2="140"/>
    <line x1="180" y1="195" x2="1080" y2="195"/>
    <line x1="180" y1="250" x2="1080" y2="250"/>
    <line x1="180" y1="305" x2="1080" y2="305"/>
    <line x1="180" y1="360" x2="1080" y2="360"/>
    <line x1="180" y1="415" x2="1080" y2="415"/>
    <line x1="180" y1="470" x2="1080" y2="470"/>
    <line x1="180" y1="525" x2="1080" y2="525"/>
  </g>
  <!-- Argollas -->
  <g fill="#9fb4c9">
    <circle cx="95" cy="130" r="14"/>
    <circle cx="95" cy="250" r="14"/>
    <circle cx="95" cy="370" r="14"/>
    <circle cx="95" cy="490" r="14"/>
  </g>
  <!-- Título manuscrito -->
  <text x="220" y="200" font-family="Caveat, cursive" font-size="84" fill="#1e3a5f" font-weight="700">
    NotaMínima
  </text>
  <!-- Subtítulo -->
  <text x="225" y="280" font-family="DM Sans, sans-serif" font-size="30" fill="#4a5e7a">
    ¿Cuánto necesitas para pasar la materia?
  </text>
  <!-- Tags -->
  <rect x="225" y="320" width="180" height="44" rx="22" fill="#1e3a5f"/>
  <text x="315" y="349" font-family="DM Sans, sans-serif" font-size="18" fill="#fffdf6" text-anchor="middle" font-weight="600">Calculadora</text>
  <rect x="420" y="320" width="160" height="44" rx="22" fill="#e0ab26"/>
  <text x="500" y="349" font-family="DM Sans, sans-serif" font-size="18" fill="#fffdf6" text-anchor="middle" font-weight="600">Cortes</text>
  <rect x="595" y="320" width="210" height="44" rx="22" fill="#2a9d5b"/>
  <text x="700" y="349" font-family="DM Sans, sans-serif" font-size="18" fill="#fffdf6" text-anchor="middle" font-weight="600">Proyección</text>
  <!-- Nota ejemplo -->
  <text x="225" y="440" font-family="Caveat, cursive" font-size="42" fill="#1e3a5f">
    Parcial 50%: 3.0 → aporta 1.5
  </text>
  <text x="225" y="495" font-family="Caveat, cursive" font-size="42" fill="#2a9d5b">
    Total del corte: 3.00 ✓ Aprobado
  </text>
</svg>
